name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/django/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:latest

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/react/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:latest

    - name: Build and push selenium
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/selenium/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-selenium:latest

  test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run unit tests
      run: |
        cd app/backend
        pip install django djangorestframework django-cors-headers
        python manage.py test

  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Pipeline status
      run: |
        echo "Pipeline completed!"
        echo "Backend image: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:latest"
        echo "Frontend image: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:latest"
        echo "Selenium image: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-selenium:latest"
