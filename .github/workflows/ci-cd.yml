name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/django/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:latest

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/react/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:latest

    - name: Build and push selenium
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/selenium/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-selenium:latest

  test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run unit tests
      run: |
        cd app/backend
        pip install django djangorestframework django-cors-headers
        python manage.py test

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, test]
    if: always()

    steps:
    - name: Slack notification success
      if: ${{ needs.build-and-push.result == 'success' && needs.test.result == 'success' }}
      uses: slackapi/slack-github-action@v1.26.0
      with:
        payload: |
          {
            "text": "✅ *CI/CD Pipeline Passed!*",
            "attachments": [
              {
                "color": "good",
                "fields": [
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                  { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                  { "title": "Build", "value": "#${{ github.run_number }}", "short": true },
                  { "title": "Status", "value": "All jobs passed ✅", "short": false },
                  { "title": "Images pushed", "value": "${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:latest\n${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:latest\n${{ secrets.DOCKERHUB_USERNAME }}/taskapp-selenium:latest", "short": false }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Slack notification failure
      if: ${{ needs.build-and-push.result == 'failure' || needs.test.result == 'failure' }}
      uses: slackapi/slack-github-action@v1.26.0
      with:
        payload: |
          {
            "text": "❌ *CI/CD Pipeline Failed!*",
            "attachments": [
              {
                "color": "danger",
                "fields": [
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                  { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                  { "title": "Build", "value": "#${{ github.run_number }}", "short": true },
                  { "title": "Status", "value": "Pipeline failed ❌ — check logs", "short": false },
                  { "title": "Logs", "value": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
